openapi: 3.0.3
info:
  title: Quiz API
  version: 1.0.0
  description: Enterprise Application Development Quiz API (Headless)
paths:
  /api/choices/:
    get:
      operationId: choices_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: question
        schema:
          type: integer
      - in: query
        name: question__exam
        schema:
          type: integer
      tags:
      - choices
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChoiceList'
          description: ''
    post:
      operationId: choices_create
      tags:
      - choices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Choice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Choice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Choice'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Choice'
          description: ''
  /api/choices/{id}/:
    get:
      operationId: choices_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this choice.
        required: true
      tags:
      - choices
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Choice'
          description: ''
    put:
      operationId: choices_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this choice.
        required: true
      tags:
      - choices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Choice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Choice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Choice'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Choice'
          description: ''
    patch:
      operationId: choices_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this choice.
        required: true
      tags:
      - choices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChoice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChoice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChoice'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Choice'
          description: ''
    delete:
      operationId: choices_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this choice.
        required: true
      tags:
      - choices
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/exams/:
    get:
      operationId: exams_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
